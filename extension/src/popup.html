<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EdgeCheck</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <img src="../icons/icon-32.png" alt="" width="20" height="20">
      <strong>EdgeCheck</strong>
    </div>
    <div class="actions">
      <button id="copy" type="button" class="ghost" data-i18n="copyReport" disabled></button>
      <button id="rescan" type="button" class="ghost" data-i18n="rescan" disabled></button>
    </div>
  </header>

  <section id="site" class="site" hidden>
    <div class="host-row">
      <span id="host" class="host"></span>
      <span id="cfchip" class="chip"></span>
    </div>
    <div id="zone" class="zone"></div>
    <div id="summary" class="summary"></div>
    <div id="deep" class="deep"></div>
  </section>

  <main id="results" aria-live="polite">
    <p id="status" class="status" data-i18n="scanning"></p>
  </main>

  <details id="ignoredBox" class="ignored" hidden>
    <summary id="ignoredTitle"></summary>
    <div id="ignoredList"></div>
  </details>

  <footer class="foot">
    <p data-i18n="limits"></p>
    <p data-i18n="trademark"></p>
    <p id="version"></p>
  </footer>
  <script type="module" src="popup.js"></script>
</body>
</html>
